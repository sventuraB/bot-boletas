[project]
name = "invoice-bot"
version = "0.1.0"
description = "Bot para extraer datos de boletas y facturas desde Google Drive y escribirlos en Google Sheets"
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "gspread>=6.0",
    "pdfplumber>=0.11",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_bot"]

[project.scripts]
invoice-bot = "invoice_bot.main:main"
